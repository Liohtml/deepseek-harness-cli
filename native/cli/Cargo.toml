[package]
name = "deepseek-harness-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Native terminal frontend for the DeepSeek Harness coding agent"
license = "MIT"
repository = "https://github.com/Liohtml/deepseek-harness-cli"
publish = false

[[bin]]
name = "dsh"
path = "src/main.rs"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
